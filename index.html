<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Учёт сырья</title>
  <meta name="theme-color" content="#121212" />
</head>
<style>
  :root {
    --bg: #121212;
    --surface: #1e1e1e;
    --text: #e0e0e0;
    --accent: #bb86fc;
    --border: #333;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --text: #000000;
      --accent: #6200ee;
      --border: #ccc;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 12px;
  }
  .container {
    max-width: 500px;
    margin: auto;
  }
  h1 { margin-top: 0; }
  .card {
    background: var(--surface);
    padding: 16px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    border: 1px solid var(--border);
  }
  input, select, button {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #2c2c2c;
    color: white;
    box-sizing: border-box;
  }
  button {
    background: var(--accent);
    color: #000;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #555; color: #aaa; }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat-item {
    text-align: center;
  }
  .stat-value { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
  .stat-label { font-size: 0.85rem; color: #888; }
  .status { padding: 8px; border-radius: 6px; text-align: center; margin-bottom: 12px; }
  .success { background: #0f9d58; color: white; }
  .error { background: #db4437; color: white; }
</style>
<body>
  <div class="container">
    <h1>Учёт сырья</h1>

    <div id="status" class="status" style="display:none;"></div>

    <!-- Статистика -->
    <div class="card">
      <h3>Итоги (текущие)</h3>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" id="soapstock-weight">0 т</div>
          <div class="stat-label">Соапсток (вес)</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="fatty-weight">0 т</div>
          <div class="stat-label">ЖК (вес)</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="soapstock-cost">0 ₽</div>
          <div class="stat-label">Соапсток (сумма)</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="fatty-cost">0 ₽</div>
          <div class="stat-label">ЖК (сумма)</div>
        </div>
      </div>
    </div>

    <!-- Форма ввода Соапстока -->
    <div class="card">
      <h3>Приём соапстока</h3>
      <select id="supplier-select"></select>
      <input type="number" id="weight-input" placeholder="Вес (т)" step="0.01" />
      <input type="number" id="price-input" placeholder="Цена (руб/т)" step="1" />
      <button id="save-soapstock-btn">✅ Сохранить</button>
    </div>

    <!-- Справочники (быстрое добавление) -->
    <div class="card">
      <h3>Добавить в справочник</h3>
      <select id="dir-type-select">
        <option value="employee">Сотрудник</option>
        <option value="supplier">Поставщик</option>
        <option value="buyer">Покупатель</option>
      </select>
      <input type="text" id="dir-value-input" placeholder="Имя / Название" />
      <button id="add-dir-btn">➕ Добавить</button>
    </div>
  </div>

  <script>
    // !!! ВСТАВЬ СЮДА СВОЙ URL ОТ GAS (заканчивается на /exec) !!!
    const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbx0cfm39Wq8oFlL2g20sFZFx-ABikhEuK411i8V0Uloy8MQAIDdRzTcLkGs8hG93R9K/exec';

    async function loadData() {
      const statusEl = document.getElementById('status');
      try {
        const res = await fetch(WEBHOOK_URL);
        const data = await res.json();
        if (data.status !== 'ok') throw new Error(data.message || 'Ошибка сервера');

        const d = data.data;

        // Заполняем статистику
        document.getElementById('soapstock-weight').textContent = (d.totals.soapstock_weight || 0).toFixed(2) + ' т';
        document.getElementById('fatty-weight').textContent = (d.totals.fatty_weight || 0).toFixed(2) + ' т';
        document.getElementById('soapstock-cost').textContent = (d.totals.soapstock_cost || 0).toLocaleString('ru-RU') + ' ₽';
        document.getElementById('fatty-cost').textContent = (d.totals.fatty_cost || 0).toLocaleString('ru-RU') + ' ₽';

        // Заполняем поставщиков
        const suppliersEl = document.getElementById('supplier-select');
        suppliersEl.innerHTML = '';
        (d.suppliers || []).forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          suppliersEl.appendChild(opt);
        });

        statusEl.className = 'status success';
        statusEl.textContent = '✅ Данные загружены';
        statusEl.style.display = 'block';
      } catch (err) {
        console.error(err);
        statusEl.className = 'status error';
        statusEl.textContent = '⚠️ Ошибка: ' + err.message;
        statusEl.style.display = 'block';
      }
    }

    document.getElementById('save-soapstock-btn').addEventListener('click', async () => {
      const supplier = document.getElementById('supplier-select').value;
      const weight = parseFloat(document.getElementById('weight-input').value) || 0;
      const price = parseFloat(document.getElementById('price-input').value) || 0;

      if (!supplier || weight <= 0 || price <= 0) {
        showStatus('⚠️ Заполни все поля (вес и цена > 0)', false);
        return;
      }

      await sendData({
        type: 'logistics',
        product: 'Соапсток',
        op_type: 'Приём сырья',
        supplier: supplier,
        weight: weight,
        price: price,
        total_cost: weight * price,
        date: new Date().toISOString().split('T')[0]
      });
    });

    document.getElementById('add-dir-btn').addEventListener('click', async () => {
      const type = document.getElementById('dir-type-select').value;
      const value = document.getElementById('dir-value-input').value.trim();
      if (!value) {
        showStatus('⚠️ Введи название', false);
        return;
      }
      await sendData({ type: 'add_directory', directory: type, value: value });
    });

    async function sendData(payload) {
      const btn = document.querySelector('button');
      const statusEl = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = '⏳ Отправка...';

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const resp = await res.json();

        if (resp.status === 'success') {
          showStatus('✅ Успешно!', true);
          loadData(); // обновить статистику и списки
        } else {
          throw new Error(resp.message || 'Ошибка от сервера');
        }
      } catch (err) {
        console.error(err);
        showStatus('❌ Ошибка: ' + err.message, false);
      } finally {
        btn.disabled = false;
        btn.textContent = btn.id === 'save-soapstock-btn' ? '✅ Сохранить' : '➕ Добавить';
      }
    }

    function showStatus(msg, isSuccess) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (isSuccess ? 'success' : 'error');
      el.style.display = 'block';
    }

    loadData();
  </script>
</body>
</html>
